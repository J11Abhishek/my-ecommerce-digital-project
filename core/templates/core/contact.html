{% extends "base.html" %}
{% load store_tags %}

{% block title %}Contact &middot; ShopSphere{% endblock %}

{% block content %}
<div class="card auth-card">
    <h1>Contact us</h1>
    <p class="muted small">This form is a practice exercise &mdash; nothing is e-mailed anywhere.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_name">Your name<span class="required">*</span></label>
            <input type="text" name="name" id="id_name" value="{{ request.POST.name|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="id_email">Email<span class="required">*</span></label>
            <input type="email" name="email" id="id_email" value="{{ request.POST.email|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="id_message">Message<span class="required">*</span></label>
            <textarea name="message" id="id_message" rows="4" required>{{ request.POST.message|default:'' }}</textarea>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send message</button>
    </form>
</div>
{% endblock %}
